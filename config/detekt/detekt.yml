# detekt 配置：在默认配置之上覆盖（--build-upon-default-config）。0 问题即通过。
# 生成物目录（core:generated 的 src/main、src/debugFeatures）不在输入里。
build:
  maxIssues: 0

config:
  validation: true

# Compose 组件惯例：参数多为可选的外观参数，函数体是界面树（DS-01）。只对 @Composable 放宽这三条。
# APP-02b 的隐私闸门向量测试由 Codex 先写、本仓库不改（任务书 §4）：只对这一个文件放宽它触发的几条规则。
complexity:
  LongParameterList:
    ignoreAnnotated: ['Composable']
  LongMethod:
    ignoreAnnotated: ['Composable']
    excludes:
      - '**/core/privacy/src/test/kotlin/com/couli/core/privacy/PrivacyGateVectorTest.kt'
      # APP-02c 的 UpdateGate 向量测试同样由 Codex 先写、本仓库不改
      - '**/core/config/src/test/kotlin/com/couli/core/update/UpdateGateVectorTest.kt'
      # APP-03a 的网络向量测试同样由 Codex 先写、本仓库不改
      - '**/core/network/src/test/kotlin/com/couli/core/network/NetworkVectorTest.kt'
      # APP-03b 的客户端内核向量测试同样由 Codex 先写、本仓库不改
      - '**/core/config/src/test/kotlin/com/couli/core/clientcore/ClientCoreVectorTest.kt'
      # APP-08 的订单向量测试同样由 Codex 先写、本仓库不改
      - '**/core/orders/src/test/kotlin/com/couli/core/orders/OrderVectorTest.kt'
      # APP-09 的钱包向量测试同样由 Codex 先写、本仓库不改
      - '**/core/wallet/src/test/kotlin/com/couli/core/wallet/WalletVectorTest.kt'
      # FU-CLIP 的剪贴板候选向量测试同样由 Codex 先写、本仓库不改
      - '**/core/clipboard/src/test/kotlin/com/couli/core/clipboard/ClipboardCandidatesVectorTest.kt'
      # APP-12 的「我的」向量测试同样由 Codex 先写、本仓库不改
      - '**/core/me/src/test/kotlin/com/couli/core/me/MeVectorTest.kt'
      # APP-11 的首页 SDUI 向量测试同样由 Codex 先写、本仓库不改
      - '**/core/home/src/test/kotlin/com/couli/core/home/HomeVectorTest.kt'
      # APP-10 的 Agent 向量测试同样由 Codex 先写、本仓库不改
      - '**/core/agent/src/test/kotlin/com/couli/core/agent/AgentVectorTest.kt'
      # APP-10b 的 Agent 传输向量测试同样由 Codex 先写、本仓库不改
      - '**/core/agent/src/test/kotlin/com/couli/core/agent/AgentTransportVectorTest.kt'
      # APP-13a 的账号向量测试同样由 Codex 先写、本仓库不改
      - '**/core/me/src/test/kotlin/com/couli/core/me/account/AccountVectorTest.kt'
  CyclomaticComplexMethod:
    excludes:
      - '**/core/wallet/src/test/kotlin/com/couli/core/wallet/WalletVectorTest.kt'
      - '**/core/orders/src/test/kotlin/com/couli/core/orders/OrderVectorTest.kt'
      - '**/core/privacy/src/test/kotlin/com/couli/core/privacy/PrivacyGateVectorTest.kt'
      - '**/core/network/src/test/kotlin/com/couli/core/network/NetworkVectorTest.kt'
      - '**/core/config/src/test/kotlin/com/couli/core/clientcore/ClientCoreVectorTest.kt'
      - '**/core/clipboard/src/test/kotlin/com/couli/core/clipboard/ClipboardCandidatesVectorTest.kt'
      - '**/core/me/src/test/kotlin/com/couli/core/me/MeVectorTest.kt'
      - '**/core/home/src/test/kotlin/com/couli/core/home/HomeVectorTest.kt'
      - '**/core/agent/src/test/kotlin/com/couli/core/agent/AgentVectorTest.kt'
      # APP-10b 的 Agent 传输向量测试同样由 Codex 先写、本仓库不改
      - '**/core/agent/src/test/kotlin/com/couli/core/agent/AgentTransportVectorTest.kt'
      - '**/core/me/src/test/kotlin/com/couli/core/me/account/AccountVectorTest.kt'
  NestedBlockDepth:
    excludes:
      - '**/core/config/src/test/kotlin/com/couli/core/clientcore/ClientCoreVectorTest.kt'
      - '**/core/me/src/test/kotlin/com/couli/core/me/MeVectorTest.kt'
      - '**/core/home/src/test/kotlin/com/couli/core/home/HomeVectorTest.kt'
      - '**/core/agent/src/test/kotlin/com/couli/core/agent/AgentVectorTest.kt'
      # APP-10b 的 Agent 传输向量测试同样由 Codex 先写、本仓库不改
      - '**/core/agent/src/test/kotlin/com/couli/core/agent/AgentTransportVectorTest.kt'
  TooManyFunctions:
    ignoreAnnotatedFunctions: ['Composable']

naming:
  FunctionNaming:
    # Compose 函数按惯例大写开头
    ignoreAnnotated: ['Composable']

style:
  # APP-10 的 Agent 向量测试由 Codex 先写、本仓库不改（任务书 §4）：只对这一个文件放宽它触发的这一条
  WildcardImport:
    excludes:
      - '**/core/agent/src/test/kotlin/com/couli/core/agent/AgentVectorTest.kt'
      # APP-10b 的 Agent 传输向量测试同样由 Codex 先写、本仓库不改
      - '**/core/agent/src/test/kotlin/com/couli/core/agent/AgentTransportVectorTest.kt'
  # APP-07 的剪贴板向量测试由 Codex 先写、本仓库不改：只对这一个文件放宽它触发的这一条
  ReturnCount:
    excludes:
      - '**/core/clipboard/src/test/kotlin/com/couli/core/clipboard/ClipboardVectorTest.kt'
      # APP-10b 的 Agent 传输向量测试由 Codex 先写、本仓库不改
      - '**/core/agent/src/test/kotlin/com/couli/core/agent/AgentTransportVectorTest.kt'
      # APP-08 的订单向量测试由 Codex 先写、本仓库不改
      - '**/core/orders/src/test/kotlin/com/couli/core/orders/OrderVectorTest.kt'
      # FU-CLIP 的剪贴板候选向量测试由 Codex 先写、本仓库不改
      - '**/core/clipboard/src/test/kotlin/com/couli/core/clipboard/ClipboardCandidatesVectorTest.kt'
      # APP-12 的「我的」向量测试由 Codex 先写、本仓库不改
      - '**/core/me/src/test/kotlin/com/couli/core/me/MeVectorTest.kt'
  # APP-06a 的搜索与详情向量测试由 Codex 先写、本仓库不改：只对这一个文件放宽它触发的这一条
  ThrowsCount:
    excludes: ['**/feature/search/src/test/kotlin/com/couli/feature/search/SearchProductVectorTest.kt']
  LoopWithTooManyJumpStatements:
    excludes:
      - '**/core/privacy/src/test/kotlin/com/couli/core/privacy/PrivacyGateVectorTest.kt'
      # APP-09 的钱包向量测试由 Codex 先写、本仓库不改
      - '**/core/wallet/src/test/kotlin/com/couli/core/wallet/WalletVectorTest.kt'
  UseCheckOrError:
    excludes: ['**/core/privacy/src/test/kotlin/com/couli/core/privacy/PrivacyGateVectorTest.kt']
  MaxLineLength:
    maxLineLength: 140
  MagicNumber:
    excludes: ['**/test/**', '**/testDebug/**', '**/androidTest/**', '**/*.kts']
  ForbiddenImport:
    active: true
    imports:
      # 03 §3.3：页面状态用 ViewModel + StateFlow；LiveData 不用
      - value: 'androidx.lifecycle.LiveData'
        reason: '页面状态用 StateFlow（03 §3.3）'
      - value: 'androidx.lifecycle.MutableLiveData'
        reason: '页面状态用 StateFlow（03 §3.3）'
