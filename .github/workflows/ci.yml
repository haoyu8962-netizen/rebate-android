# 内容只是调用本机 CI 入口 tools/ci/verify.sh（03 §11）。
# FU-AND-CI-UPSTREAM-FETCH（D10-2842）：
# - 检出两个上游仓库（都是公开仓库，不需要凭据），布局和本机一致：rebate-android、rebate-platform、couli 三个目录并排，
#   contract.lock 里的相对路径 ../rebate-platform、../couli 直接成立；另外用 REBATE_PLATFORM_DIR / COULI_DIR 显式指过去。
#   fetch-depth: 0：锁定的提交不一定是上游 main 的最新提交。
# - verify.sh 第 6b 步（tools/ci/ui-tests.sh，真实 WebView 仪器测试）要一台在线模拟器，口径是「不跳过」；
#   所以整个 verify.sh 放在 reactivecircus/android-emulator-runner 起好的模拟器里跑（API 36 google_apis x86_64，和本机整轮同级）。
# - 所有 action 都钉完整提交号；permissions 只给 contents: read；不使用任何 secret。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: rebate-android
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: haoyu8962-netizen/rebate-platform
          path: rebate-platform
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: haoyu8962-netizen/couli
          path: couli
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: add swap and start memory log
        # 第二次实跑在单元测试编译时整步被外部终止（无报错、无汇总），疑似内存耗尽：模拟器 + 两个 Xmx4g 的 Gradle 守护进程 + 并行测试进程。
        # 加 8G 交换区缓冲，并每 15 秒记一次内存，失败与否都在最后打印内核 OOM 记录、上传内存日志。
        run: |
          sudo fallocate -l 8G /mnt/ci-extra.swap
          sudo chmod 600 /mnt/ci-extra.swap
          sudo mkswap /mnt/ci-extra.swap >/dev/null
          sudo swapon /mnt/ci-extra.swap
          free -m
          nohup sh -c 'while true; do date -u +%H:%M:%S; free -m | sed -n 2,3p; sleep 15; done' > "${RUNNER_TEMP}/mem.log" 2>&1 &
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: verify (emulator up)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        env:
          REBATE_PLATFORM_DIR: ${{ github.workspace }}/rebate-platform
          COULI_DIR: ${{ github.workspace }}/couli
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          working-directory: rebate-android
          script: tools/ci/verify.sh
      - name: memory and OOM diagnostics
        if: always()
        run: |
          free -m
          sudo dmesg -T | grep -i -E "out of memory|killed process|oom" | tail -20 || true
          tail -n 400 "${RUNNER_TEMP}/mem.log" || true
          cp "${RUNNER_TEMP}/mem.log" rebate-android/mem.log 2>/dev/null || true
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-reports
          path: |
            rebate-android/mem.log
            rebate-android/build/verify/
            rebate-android/**/build/reports/
