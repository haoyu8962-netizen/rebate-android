# 内容只调用本机 CI 入口 tools/ci/verify.sh（03 §11）。
# FU-AND-CI-DEVICE-JOB（D10-2878，从 PR #2 拆出）：只保留 device 作业，起模拟器跑 verify.sh 第 6b 步
# （tools/ci/ui-tests.sh，真实 WebView 仪器测试，「不跳过」口径不变）。
# 第 6b 步以外的 verify 步骤暂不在 CI 上跑：托管机上整套 main 作业的问题（Linux / Mac 截图差、60 分钟、内存）
# 另登 FU-AND-CI-MAIN-JOB，分支 task/FU-AND-CI-MAIN-JOB；在那之前，合入仍以本机整轮为准。
# --ci-part 只在 GITHUB_ACTIONS=true 时可用，本机仍跑全部 48 步。
# 所有 action 都钉完整提交号；permissions 只有 contents: read；不使用任何 secret。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: rebate-android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # D10-2863 ①：PR 分支也写 Gradle 缓存，减少从 Maven Central 下载（托管机 IP 被限流 429）。
          # GitHub 的缓存按分支隔离：PR 写的缓存只有这个 PR 能读，主干读不到。
          cache-read-only: false
      - name: start memory log
        run: |
          nohup sh -c 'while true; do date -u +%H:%M:%S; free -m | sed -n 2,3p; sleep 15; done' > "${RUNNER_TEMP}/mem.log" 2>&1 &
      # D10-2863 ②：起模拟器前先预构建测试包（下载依赖），下载失败隔 60 秒重试，最多 3 次。
      # 只是预构建；第 6b 步的判据不变，仪器测试本身不重试。
      - name: pre-build web test package (retry on download errors)
        working-directory: rebate-android
        run: |
          for i in 1 2 3; do
            if ./gradlew --console=plain :feature:web:assembleDebugAndroidTest; then exit 0; fi
            echo "预构建第 ${i} 次失败"
            if [ "${i}" -lt 3 ]; then sleep 60; fi
          done
          exit 1
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: verify step 6b (emulator up)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          working-directory: rebate-android
          script: tools/ci/verify.sh --ci-part=device
      - name: memory and OOM diagnostics
        if: always()
        run: |
          free -m
          sudo dmesg -T | grep -i -E "out of memory|killed process|oom" | tail -20 || true
          tail -n 400 "${RUNNER_TEMP}/mem.log" || true
          cp "${RUNNER_TEMP}/mem.log" rebate-android/mem.log 2>/dev/null || true
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-device-reports
          path: |
            rebate-android/mem.log
            rebate-android/build/verify/
            rebate-android/**/build/reports/
