# 内容只是调用本机 CI 入口 tools/ci/verify.sh（03 §11）。
# FU-AND-CI-UPSTREAM-FETCH（D10-2842 / 2847 / 2857）：
# - 托管机（4 核 16G）上「模拟器常驻 + 整套 verify」两次被拖死（runner 失联），所以拆成两个并行作业，各占一台托管机：
#   verify-main：不起模拟器，verify.sh --ci-part=main 跑第 6b 步以外的全部步骤（第 6b 步在汇总里记「委托」）；
#   verify-device：起模拟器，verify.sh --ci-part=device 只跑第 6b 步（tools/ci/ui-tests.sh，真实 WebView 仪器测试，「不跳过」口径不变）。
#   两个作业合起来覆盖 verify.sh 的全部步骤（对照表在 PR 说明里）；--ci-part 只在 GITHUB_ACTIONS=true 时可用，本机仍跑全部步骤。
# - 上游仓库（公开，不需要凭据）和 rebate-android 并排检出，fetch-depth 0；REBATE_PLATFORM_DIR / COULI_DIR 显式指过去。
# - 所有 action 都钉完整提交号；permissions 只有 contents: read；不使用任何 secret。
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-main:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: rebate-android
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: haoyu8962-netizen/rebate-platform
          path: rebate-platform
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: haoyu8962-netizen/couli
          path: couli
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # D10-2863 ①：PR 分支也写 Gradle 缓存，减少从 Maven Central 下载（托管机 IP 被限流 429）。
          # GitHub 的缓存按分支隔离：PR 写的缓存只有这个 PR 能读，主干读不到。
          cache-read-only: false
      - name: add swap and start memory log
        run: |
          sudo fallocate -l 8G /mnt/ci-extra.swap
          sudo chmod 600 /mnt/ci-extra.swap
          sudo mkswap /mnt/ci-extra.swap >/dev/null
          sudo swapon /mnt/ci-extra.swap
          free -m
          nohup sh -c 'while true; do date -u +%H:%M:%S; free -m | sed -n 2,3p; sleep 15; done' > "${RUNNER_TEMP}/mem.log" 2>&1 &
      # D10-2863 ③：Robolectric 运行时下载 android-all jar 到 ~/.m2（不在 Gradle 缓存里），单独缓存。
      # 键带依赖声明文件（libs.versions.toml 与全部 *.gradle.kts）的哈希；save 用 always()，测试失败也留住已下载的 jar。
      - name: restore Robolectric jars
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('rebate-android/gradle/libs.versions.toml', 'rebate-android/**/*.gradle.kts') }}
      - name: verify (all steps except 6b)
        working-directory: rebate-android
        env:
          REBATE_PLATFORM_DIR: ${{ github.workspace }}/rebate-platform
          COULI_DIR: ${{ github.workspace }}/couli
        run: tools/ci/verify.sh --ci-part=main
      - name: save Robolectric jars
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ runner.os }}-${{ hashFiles('rebate-android/gradle/libs.versions.toml', 'rebate-android/**/*.gradle.kts') }}
      - name: memory and OOM diagnostics
        if: always()
        run: |
          free -m
          sudo dmesg -T | grep -i -E "out of memory|killed process|oom" | tail -20 || true
          tail -n 400 "${RUNNER_TEMP}/mem.log" || true
          cp "${RUNNER_TEMP}/mem.log" rebate-android/mem.log 2>/dev/null || true
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-main-reports
          path: |
            rebate-android/mem.log
            rebate-android/build/verify/
            rebate-android/**/build/reports/

  verify-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: rebate-android
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          # D10-2863 ①：PR 分支也写 Gradle 缓存，减少从 Maven Central 下载（托管机 IP 被限流 429）。
          # GitHub 的缓存按分支隔离：PR 写的缓存只有这个 PR 能读，主干读不到。
          cache-read-only: false
      - name: start memory log
        run: |
          nohup sh -c 'while true; do date -u +%H:%M:%S; free -m | sed -n 2,3p; sleep 15; done' > "${RUNNER_TEMP}/mem.log" 2>&1 &
      # D10-2863 ②：起模拟器前先预构建测试包（下载依赖），下载失败隔 60 秒重试，最多 3 次。
      # 只是预构建；第 6b 步的判据不变，仪器测试本身不重试。
      - name: pre-build web test package (retry on download errors)
        working-directory: rebate-android
        run: |
          for i in 1 2 3; do
            if ./gradlew --console=plain :feature:web:assembleDebugAndroidTest; then exit 0; fi
            echo "预构建第 ${i} 次失败"
            if [ "${i}" -lt 3 ]; then sleep 60; fi
          done
          exit 1
      - name: enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: verify step 6b (emulator up)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          working-directory: rebate-android
          script: tools/ci/verify.sh --ci-part=device
      - name: memory and OOM diagnostics
        if: always()
        run: |
          free -m
          sudo dmesg -T | grep -i -E "out of memory|killed process|oom" | tail -20 || true
          tail -n 400 "${RUNNER_TEMP}/mem.log" || true
          cp "${RUNNER_TEMP}/mem.log" rebate-android/mem.log 2>/dev/null || true
      - name: upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verify-device-reports
          path: |
            rebate-android/mem.log
            rebate-android/build/verify/
            rebate-android/**/build/reports/
