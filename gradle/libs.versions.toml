# 版本目录（03 §3.3：Gradle KTS + 版本目录 + convention 插件）。
# 只允许 APP-01 任务书 §2.1 白名单里的依赖；版本一律精确值。
[versions]
# androidx 取「能以 compileSdk 36 编译」的最新稳定版：Compose 1.12（BOM 2026.08+）、core 1.19、
# lifecycle 2.11、navigation 2.10 要求 compileSdk 37，任务书定 compileSdk / targetSdk 36（03 §10.4），暂不升。
agp = "9.4.1"
kotlin = "2.4.20"
ksp = "2.3.12"
hilt = "2.60.1"
compose-bom = "2026.06.01"
androidx-core = "1.18.0"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.10.0"
androidx-navigation = "2.9.8"
kotlinx-serialization = "1.11.0"
kotlinx-coroutines = "1.11.0"
junit4 = "4.13.2"
robolectric = "4.17"
androidx-test-core = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-test-runner = "1.7.0"
androidx-test-espresso = "3.7.0"
ktlint = "1.8.0"
# 快照测试（DS-01 任务书 §6 允许的唯一新依赖，只给测试）
roborazzi = "1.76.0"
# 网络层（APP-03a 任务书 §0 允许的新依赖：OkHttp 与测试用 MockWebServer）
# 取能以 compileSdk 36 编译的最新稳定版：5.5.0 的 okhttp-android 要求 compileSdk 37（AAR 元数据 minCompileSdk）。
okhttp = "5.4.0"
detekt = "1.23.8"
# WebView 传输层（APP-04 任务书 §0 允许的新依赖）：WebViewCompat.addWebMessageListener、addDocumentStartJavaScript、
# 多配置文件（ExternalWebView 不共享 Cookie）。1.17.1 是能以 compileSdk 36 编译的最新稳定版（AAR minCompileSdk 33）。
androidx-webkit = "1.17.1"

# Android SDK 级别（不是依赖，放这里便于统一调整）
android-compileSdk = "36"
android-targetSdk = "36"
android-minSdk = "26"

[libraries]
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "androidx-navigation" }

compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }

hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }

kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }

junit4 = { module = "junit:junit", version.ref = "junit4" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test-core" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "androidx-test-espresso" }
roborazzi = { module = "io.github.takahirom.roborazzi:roborazzi", version.ref = "roborazzi" }
roborazzi-compose = { module = "io.github.takahirom.roborazzi:roborazzi-compose", version.ref = "roborazzi" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }

# 静态检查工具（经 JavaExec 运行 CLI，不进 App 依赖）
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }

# build-logic 编译期依赖（convention 插件引用其类型）
android-gradle-plugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradle-plugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
roborazzi = { id = "io.github.takahirom.roborazzi", version.ref = "roborazzi" }

# 本仓库 convention 插件（build-logic/convention）
couli-android-application = { id = "couli.android.application" }
couli-android-library = { id = "couli.android.library" }
couli-android-compose = { id = "couli.android.compose" }
couli-kotlin-library = { id = "couli.kotlin.library" }
couli-lint = { id = "couli.lint" }
